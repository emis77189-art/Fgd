<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>النظام البيتي — المعلم</title>
<style>:root{--g:#f4c75b;--p:#101b2c;--l:#31445e}*{box-sizing:border-box}body{margin:0;background:#070d18;color:#f6f4ed;font-family:Tahoma,Arial,sans-serif;padding:14px;max-width:760px;margin:auto}h1{color:#ffdf83;font-size:21px}h3{color:var(--g);margin:6px 0}
nav{display:flex;gap:6px;position:sticky;top:0;background:#070d18;padding:6px 0}nav button{flex:1}button{border:1px solid var(--l);border-radius:12px;padding:10px;font:inherit;background:#17263a;color:#f6f4ed}button.on,.go{background:linear-gradient(135deg,#fff0a7,#e8b83d);color:#211a08;font-weight:bold;border:0}
.c{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:13px;margin:10px 0}input,textarea{width:100%;background:#0b1422;border:1px solid #344761;border-radius:10px;color:#f6f4ed;padding:10px;font:inherit;margin:4px 0 10px}label{font-size:13px;color:#aab6c8}.r{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid #1d2c42}.sm{padding:7px 11px;font-size:13px}.p{display:none}.p.on{display:block}</style></head><body>
<a href="index.html" style="color:#f4c75b;text-decoration:none;font-size:14px">→ العودة إلى الصف الذهبي</a><h1>🏠 النظام البيتي</h1><nav id="nv"></nav><div id="v"></div>
<script src="home-core.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getDatabase,ref,get,set,onValue,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
const db=getDatabase(initializeApp({apiKey:"AIzaSyD23rt6LjPpLfKtNnoT4Sb4DFN8XDWf8MQ",authDomain:"manssa-c72f5.firebaseapp.com",projectId:"manssa-c72f5",appId:"1:700342818242:web:140e444c4eb459a74af25b"}));
const V=document.getElementById('v'),D=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'],tabs=['الجدول','النظام','التلاميذ','المتابعة'];
let tab=({schedule:0,system:1})[location.hash.slice(1)]||0,cfg={...DEF},sch={},sts={},logs={},names={},day=dayKey(new Date()),open={};
const R=p=>ref(db,'home/'+p),rnd=()=>Math.random().toString(36).slice(2,10),base=location.href.replace(/[^/]*$/,'')+'student.html';
const wa=t=>window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
const tot=i=>Object.values(logs[i]||{}).reduce((a,d)=>a+Object.values(d).reduce((b,x)=>b+(x.p||0),0),0);
function nav(){document.getElementById('nv').innerHTML=tabs.map((t,i)=>'<button class="'+(i==tab?'on':'')+'" onclick="T('+i+')">'+t+'</button>').join('')}
window.T=i=>{tab=i;draw()};
const subs=i=>{const e=document.getElementById('d'+i);return e?e.value.split('\n').map(x=>x.trim()).filter(Boolean):(sch[i]||[])};
function plan(i){return'📅 جدول يوم '+D[i]+'\n\n'+gen(cfg,subs(i),i).map(t=>'▫️ '+m2t(t.from)+' '+t.title).join('\n')+'\n\n⭐ افتحوا الرابط الموحد واضغطوا «تم» عند إنجاز كل مهمة في وقتها:\n'+base}
function draw(){nav();const di=new Date().getDay();let h='';
 if(tab==0)h='<div class="c"><button class="go" style="width:100%" onclick="ST()">📤 إرسال جدول اليوم للكروب</button></div>'+D.map((d,i)=>'<div class="c"><h3>'+d+'</h3><label>المواد (كل مادة في سطر)</label><textarea id="d'+i+'" rows="4">'+((sch[i]||[]).join('\n'))+'</textarea><button class="sm" onclick="SD('+i+')">📤 حفظ وإرسال جدول '+d+'</button></div>').join('')+'<button class="go" style="width:100%" onclick="SS()">حفظ ونشر الجدول</button>';
 if(tab==1)h='<div class="c">'+[['wake','وقت الاستيقاظ'],['sleep','ساعة النوم'],['lunch','الغداء (الدوام الصباحي)'],['lunchPm','الغداء (الدوام العصري)'],['dinner','العشاء']].map(x=>'<label>'+x[1]+'</label><input type="time" id="c_'+x[0]+'" value="'+cfg[x[0]]+'">').join('')+'<label>رمز الأهل لتأكيد النوم (4 أرقام، اتركه فارغًا لإلغائه)</label><input id="c_pin" maxlength="4" inputmode="numeric" value="'+(cfg.pin||'')+'"><label><input type="checkbox" id="c_swap" '+(cfg.swap?'checked':'')+' style="width:auto"> عكس الدوامين (شباط: الأحد والاثنين عصري)</label><br><br><button class="go" onclick="SC()">حفظ</button></div><div class="c"><small>الدوام الحالي: الأحد والاثنين '+(cfg.swap?'عصري':'صباحي')+'، والثلاثاء إلى الخميس '+(cfg.swap?'صباحي':'عصري')+'. وقت الدوام يُستثنى تلقائيًا.</small></div>';
 if(tab==2)h='<div class="c"><button class="go" style="width:100%" onclick="LK()">📤 إرسال الرابط الموحد لكروب الصف</button><br><br><button class="sm" onclick="CP()">نسخ الرابط</button><small style="display:block;margin-top:8px;color:#aab6c8">رابط واحد لا يتغير، يكتب فيه التلميذ اسمه الثلاثي مرة واحدة فقط، ويتحدّث محتواه يوميًا تلقائيًا.</small></div><div class="c"><button class="go" onclick="IM()">استيراد التلاميذ من الصف الذهبي</button><br><br><input id="nm" placeholder="اسم تلميذ جديد (ثلاثي)"><button class="go" onclick="AD()">＋ إضافة تلميذ</button></div><div class="c">'+Object.keys(sts).map(i=>'<div class="r"><span>'+sts[i].name+'</span><span>⭐ '+tot(i)+' <button class="sm" onclick="DL(\''+i+'\')">حذف</button></span></div>').join('')+'</div>';
 if(tab==3){const dd=new Date(day+'T12:00:00').getDay(),T=dd<5?gen(cfg,sch[dd],dd):[];
  h='<div class="c"><label>التاريخ (السجلات السابقة محفوظة)</label><input type="date" id="dt" value="'+day+'" onchange="DY(this.value)"></div><div class="c">'+Object.keys(sts).map(i=>{const Lg=(logs[i]||{})[day]||{};let p=0,n=0;Object.values(Lg).forEach(x=>{n++;p+=x.p||0});
   const sl=Lg.sleep?new Date(Lg.sleep.t).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'}):'—';
   return'<div class="r" onclick="OP(\''+i+'\')" style="cursor:pointer"><span>'+sts[i].name+'</span><span>مهام '+n+'/'+T.length+' · نقاط <b>'+p+'</b> · نوم '+sl+' · مجموع '+tot(i)+'</span></div>'+
   (open[i]?'<div style="padding:6px 10px;font-size:13px">'+(T.length?T:[]).map(t=>{const x=Lg[t.id];return'<div>'+(x?'✅':'⬜')+' '+t.title+' <small>'+(x?new Date(x.t).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'})+' · +'+(x.p||0):m2t(t.from))+'</small></div>'}).join('')+'</div>':'')}).join('')+'</div>'}
 V.innerHTML=h}
window.OP=i=>{open[i]=!open[i];draw()};window.DY=v=>{day=v||day;draw()};
async function save(){const o={};D.forEach((d,i)=>o[i]=subs(i));await set(R('schedule'),o)}
window.SS=async()=>{await save();alert('تم الحفظ والنشر ✔')};
window.SD=async i=>{await save();wa(plan(i))};
window.ST=()=>{const d=new Date().getDay();d>4?alert('اليوم عطلة'):SD(d)};
window.SC=async()=>{const o={};['wake','sleep','lunch','lunchPm','dinner'].forEach(k=>o[k]=document.getElementById('c_'+k).value);o.swap=document.getElementById('c_swap').checked;o.pin=document.getElementById('c_pin').value.trim();await set(R('config'),o);alert('تم الحفظ ✔')};
window.LK=()=>wa('السلام عليكم، هذا الرابط الموحد لمتابعة مهام الصف الرابع اليومية.\nافتحوه واكتبوا الاسم الثلاثي مرة واحدة فقط، وبعدها يفتح مباشرة كل يوم:\n'+base);
window.CP=async()=>{await navigator.clipboard.writeText(base);alert('تم نسخ الرابط')};
async function sync(){for(const i in sts)for(const k of nkeys(sts[i].name))if(!names[k]){names[k]=i;await set(R('names/'+k),i)}}
const mk=n=>set(R('students/m'+rnd()),{name:n});
window.AD=async()=>{const e=document.getElementById('nm'),n=e.value.trim();if(!n)return;await mk(n);e.value=''};
window.DL=async i=>{if(confirm('حذف '+sts[i].name+'؟'))await set(R('students/'+i),null)};
window.IM=async()=>{let L=[];
 try{L=JSON.parse(localStorage.getItem('golden_class_v2')||'{}').students||[]}catch(e){}
 if(!L.length)try{const v=await new Promise((res,rej)=>{const r=indexedDB.open('golden_class_db',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onerror=()=>rej();r.onsuccess=()=>{try{const g=r.result.transaction('kv').objectStore('kv').get('golden_class_v2');g.onsuccess=()=>res(g.result);g.onerror=()=>rej()}catch(e){rej()}}});L=JSON.parse(v||'{}').students||[]}catch(e){}
 if(!L.length)try{const x=await get(ref(db,'backups/goldenClassData/savedContent/students'));L=x.val()||[];if(!Array.isArray(L))L=Object.values(L)}catch(e){}
 if(!L.length)return alert('لم أجد تلاميذ. أضفهم يدويًا.');let n=0;
 for(const s of L)if(s&&s.id&&s.name&&!sts[s.id]){await set(R('students/'+s.id),{name:s.name});n++}alert('تم استيراد '+n+' تلميذ')};
onValue(R('config'),v=>{cfg={...DEF,...(v.val()||{})};draw()});onValue(R('schedule'),v=>{sch=v.val()||{};draw()});
onValue(R('names'),v=>{names=v.val()||{};sync()});onValue(R('students'),v=>{sts=v.val()||{};draw();sync()});onValue(R('log'),v=>{logs=v.val()||{};tab>1&&draw()});
</script></body></html>
